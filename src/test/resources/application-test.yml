spring:
  datasource:
    url: jdbc:h2:mem:veriqra-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  # The tests keep their sessions in the memory of the process, so a request can carry
  # a plain session object. A deployment keeps them in the database, which is what the
  # browser check covers.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

veriqra:
  institution-name: Test College
  institution-location: Test City
  # The tests run at any hour of the day, so the window in which attendance may be
  # opened is widened to the whole day.
  attendance:
    open-before-minutes: 1440
    open-after-minutes: 1440

logging:
  level:
    root: WARN
    com.veriqra.app: INFO
    org.springframework.test: WARN
