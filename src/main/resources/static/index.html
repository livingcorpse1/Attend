<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="VeriQra verifies class attendance with a rotating QR code and a server side face check.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VeriQra">
  <title>VeriQra · Presence, verified.</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/home.css">

  <script src="/vendor/qrcode.min.js" defer></script>
  <script src="/vendor/jsQR.min.js" defer></script>
</head>
<body>
  <div id="app">
    <div class="empty-state">
      <div class="spinner" aria-hidden="true"></div>
      <p>Starting VeriQra…</p>
    </div>
  </div>
  <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>
  <noscript>
    <div class="empty-state">
      <p>VeriQra needs JavaScript to run. Please enable it and reload the page.</p>
    </div>
  </noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
