<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>VeriQra · You are offline</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <main class="auth-main" style="min-height: 100vh">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">V</span>
        <span>VeriQra</span>
      </div>
      <p class="eyebrow">No connection</p>
      <h1>You are offline</h1>
      <p class="lead">
        VeriQra needs the server to take attendance, so marking your presence is paused
        until the connection is back. Nothing you have already recorded has been lost.
      </p>
      <div class="alert alert-info" style="margin-top: 1.5rem">
        <span>The screens you have already opened stay available. Reconnect and try again.</span>
      </div>
      <a class="button button-primary button-block button-lg" style="margin-top: 1.5rem" href="/">Try again</a>
    </div>
  </main>
</body>
</html>
